name: Full Sheet VPN Fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-sheet-vpn-fast.yml'

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install VPN tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn iproute2 iptables curl
      - name: Parallel VPN probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/full-sheet-audit /tmp/relays
          python3 - <<'PY'
          import json,pathlib
          rows=json.loads(pathlib.Path('results/full-sheet-audit/cloak_access_fast.json').read_text())
          t=[r for r in rows if r.get('direct_class')=='BLOCKED' and not r.get('cloak_ok') and str(r.get('url','')).startswith('https://')]
          pathlib.Path('/tmp/targets.json').write_text(json.dumps(t,ensure_ascii=False));print('targets',len(t))
          PY
          if [ "$(python3 -c 'import json;print(len(json.load(open("/tmp/targets.json"))))')" = 0 ]; then echo '[]' > results/full-sheet-audit/vpn_access_fast.json; exit 0; fi
          curl -fsSL --max-time 30 'https://www.vpngate.net/api/iphone/' -o /tmp/vpngate.csv
          python3 - <<'PY'
          import base64,csv,io,pathlib
          pref=['TH','SG','JP','KR','VN','MY','PH','ID','TW'];raw=pathlib.Path('/tmp/vpngate.csv').read_text(encoding='utf-8-sig',errors='replace')
          rows=list(csv.DictReader(io.StringIO('\n'.join(x for x in raw.splitlines() if x and not x.startswith('*')))));pathlib.Path('/tmp/auth').write_text('vpn\nvpn\n');out=[]
          for c in pref:
            rs=[r for r in rows if (r.get('CountryShort') or '').upper()==c and (r.get('OpenVPN_ConfigData_Base64') or '').strip()];rs.sort(key=lambda r:int(r.get('Speed') or 0),reverse=True)
            for r in rs[:2]:
              try:cfg=base64.b64decode(r['OpenVPN_ConfigData_Base64']).decode(errors='replace')
              except:continue
              cfg='\n'.join('auth-user-pass /tmp/auth' if x.strip().startswith('auth-user-pass') else x for x in cfg.splitlines())+'\n';p=pathlib.Path(f'/tmp/relays/{len(out):02d}-{c}.ovpn');p.write_text(cfg);out.append({'cfg':str(p),'country':c,'relay':r.get('IP','')})
          pathlib.Path('/tmp/relays.json').write_text(__import__('json').dumps(out));print('relays',len(out))
          PY
          IFACE=$(ip route show default | awk '{print $5; exit}')
          sudo ip netns add vpnns
          sudo ip link add vh type veth peer name vn
          sudo ip link set vn netns vpnns
          sudo ip addr add 10.238.0.1/24 dev vh
          sudo ip link set vh up
          sudo ip netns exec vpnns ip addr add 10.238.0.2/24 dev vn
          sudo ip netns exec vpnns ip link set lo up
          sudo ip netns exec vpnns ip link set vn up
          sudo ip netns exec vpnns ip route add default via 10.238.0.1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo iptables -t nat -A POSTROUTING -s 10.238.0.0/24 -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i vh -o "$IFACE" -j ACCEPT
          sudo iptables -A FORWARD -i "$IFACE" -o vh -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo mkdir -p /etc/netns/vpnns
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/netns/vpnns/resolv.conf >/dev/null
          python3 - <<'PY'
          import concurrent.futures as cf,json,subprocess,pathlib,re,html,time
          targets=json.loads(pathlib.Path('/tmp/targets.json').read_text()); relays=json.loads(pathlib.Path('/tmp/relays.json').read_text()); remaining={(x['kind'],x['row']):x for x in targets}; rescued=[]
          terms=('just a moment','attention required','verify you are human','verifying connection','checking your browser','access denied','security verification','prove your humanity')
          def sh(cmd,timeout=25):return subprocess.run(cmd,capture_output=True,text=True,timeout=timeout)
          def probe(x,country,relay,exitip):
            f=f"/tmp/vpn-{x['kind']}-{x['row']}.html";cmd=['sudo','ip','netns','exec','vpnns','curl','-L','--compressed','--connect-timeout','7','--max-time','14','-A','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36','-sS','-o',f,'-w','%{http_code}\t%{size_download}',x['url']]
            try:p=sh(cmd,20);parts=(p.stdout or '').strip().split('\t');code=int(parts[0]) if parts and parts[0].isdigit() else 0;size=int(float(parts[1])) if len(parts)>1 and parts[1] else 0
            except Exception:return None
            s=pathlib.Path(f).read_text(errors='ignore') if pathlib.Path(f).exists() else '';m=re.search(r'<title[^>]*>(.*?)</title>',s,re.I|re.S);title=html.unescape(re.sub(r'\s+',' ',m.group(1)).strip())[:160] if m else '';low=(title+' '+s[:12000]).lower();challenge=next((z for z in terms if z in low),None)
            if 200<=code<400 and size>500 and not challenge:return {**x,'country':country,'relay':relay,'exit_ip':exitip,'http':code,'bytes':size,'title':title}
            return None
          for idx,r in enumerate(relays[:8],1):
            if not remaining:break
            sh(['sudo','ip','netns','exec','vpnns','pkill','openvpn'],5);time.sleep(.5);pathlib.Path('/tmp/openvpn.log').write_text('');subprocess.run(['sudo','chmod','666','/tmp/openvpn.log'])
            subprocess.run(['sudo','ip','netns','exec','vpnns','openvpn','--config',r['cfg'],'--daemon','--log','/tmp/openvpn.log'])
            good=False
            for _ in range(12):
              time.sleep(1);log=pathlib.Path('/tmp/openvpn.log').read_text(errors='ignore')
              if 'Initialization Sequence Completed' in log:good=True;break
              if any(z in log for z in ('AUTH_FAILED','TLS Error','Connection timed out','Connection refused','fatal error')):break
            if not good:continue
            try:exitip=sh(['sudo','ip','netns','exec','vpnns','curl','-fsS','--max-time','8','https://api.ipify.org'],12).stdout.strip()
            except:exitip=''
            vals=list(remaining.values())
            with cf.ThreadPoolExecutor(max_workers=16) as ex:
              for got in ex.map(lambda x:probe(x,r['country'],r['relay'],exitip),vals):
                if got:rescued.append(got);remaining.pop((got['kind'],got['row']),None)
            print('relay',idx,r['country'],exitip,'rescued_total',len(rescued),'remaining',len(remaining),flush=True)
          pathlib.Path('results/full-sheet-audit/vpn_access_fast.json').write_text(json.dumps(rescued,ensure_ascii=False,indent=2));print('rescued',len(rescued))
          PY
      - name: Persist
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/full-sheet-audit/vpn_access_fast.json
          git commit -m 'Store fast VPN sheet retry [skip ci]' || true
          git pull --rebase origin main || true
          git push || true
