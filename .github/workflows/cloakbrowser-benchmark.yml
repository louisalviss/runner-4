name: CloakBrowser Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'jobs/cloakbrowser-benchmark/**'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOAKBROWSER_VERSION: '146.0.7680.177.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install stock Playwright and CloakBrowser
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s)
          python -m pip install -q 'cloakbrowser==0.5.3'
          python -m playwright install --with-deps chromium
          CLOAKBROWSER_VERSION="$CLOAKBROWSER_VERSION" python -m cloakbrowser install
          echo "INSTALL_SECONDS=$(($(date +%s)-START))"

      - name: Compare stock Playwright vs CloakBrowser
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python - <<'PY'
          import json, time, traceback
          from playwright.sync_api import sync_playwright
          from cloakbrowser import launch

          targets = [
              'https://example.com/',
              'https://bot.sannysoft.com/',
              'https://deviceandbrowserinfo.com/are_you_a_bot',
          ]
          js = '''() => ({
            webdriver: navigator.webdriver,
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            languages: navigator.languages,
            plugins: navigator.plugins.length,
            hasChrome: !!window.chrome,
            hardwareConcurrency: navigator.hardwareConcurrency,
            deviceMemory: navigator.deviceMemory ?? null,
            screen: [screen.width, screen.height, screen.colorDepth, screen.pixelDepth]
          })'''

          def run_engine(browser, name):
              out = {'engine': name, 'targets': []}
              t_all = time.perf_counter()
              for url in targets:
                  item = {'url': url}
                  t = time.perf_counter()
                  page = None
                  try:
                      page = browser.new_page(viewport={'width':1365,'height':768})
                      resp = page.goto(url, wait_until='domcontentloaded', timeout=45000)
                      page.wait_for_timeout(3000)
                      text = page.locator('body').inner_text(timeout=10000)
                      item.update({
                          'ok': True,
                          'status': resp.status if resp else None,
                          'title': page.title(),
                          'signals': page.evaluate(js),
                          'body_chars': len(text),
                          'body_excerpt': text[:3500],
                      })
                  except Exception as e:
                      item.update({'ok': False, 'error': f'{type(e).__name__}: {e}'})
                  finally:
                      if page:
                          try: page.close()
                          except Exception: pass
                  item['seconds'] = round(time.perf_counter()-t, 3)
                  out['targets'].append(item)
              out['total_seconds'] = round(time.perf_counter()-t_all, 3)
              return out

          result = []
          try:
              with sync_playwright() as pw:
                  b = pw.chromium.launch(headless=False)
                  result.append(run_engine(b, 'stock-playwright'))
                  b.close()
          except Exception as e:
              result.append({'engine':'stock-playwright','fatal':f'{type(e).__name__}: {e}','trace':traceback.format_exc()[-2000:]})

          try:
              b = launch(browser_version='146.0.7680.177.5', headless=False, humanize=True)
              result.append(run_engine(b, 'cloakbrowser'))
              b.close()
          except Exception as e:
              result.append({'engine':'cloakbrowser','fatal':f'{type(e).__name__}: {e}','trace':traceback.format_exc()[-2000:]})

          print('CLOAK_BENCHMARK_RESULT_START')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          print('CLOAK_BENCHMARK_RESULT_END')
          PY
