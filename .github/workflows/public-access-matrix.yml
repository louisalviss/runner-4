name: Public Access Matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-access-matrix.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe public sites
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, re, pathlib, html
          urls = [
            # Social / radar / supplemental
            ('Zhihu','https://www.zhihu.com/'),('Weibo','https://weibo.com/'),('Instagram','https://www.instagram.com/'),
            ('Facebook','https://www.facebook.com/'),('Threads','https://www.threads.net/'),('Bilibili','https://www.bilibili.com/'),
            ('Reddit','https://www.reddit.com/'),('X','https://x.com/'),('TikTok','https://www.tiktok.com/'),
            ('YouTube','https://www.youtube.com/'),('LinkedIn','https://www.linkedin.com/'),('Discord','https://discord.com/'),
            ('Medium','https://medium.com/'),('HackerNoon','https://hackernoon.com/'),('Quora','https://www.quora.com/'),
            ('Imgur','https://imgur.com/'),('Pinterest','https://www.pinterest.com/'),('Flickr','https://www.flickr.com/'),
            ('Pixabay','https://pixabay.com/'),('Pexels','https://www.pexels.com/'),
            # Core30
            ('CrunchBase','https://www.crunchbase.com/'),('Future Tools','https://www.futuretools.io/'),('LaunchBase','https://launchbase.app/'),
            ('SaaSHub','https://www.saashub.com/'),('SideProjectors','https://www.sideprojectors.com/'),('StartupBase','https://startupbase.io/'),
            ('AlternativeTo','https://alternativeto.net/'),('Wellfound','https://wellfound.com/'),('BetaList','https://betalist.com/'),
            ('Capterra','https://www.capterra.com/'),('Dev Hunt','https://devhunt.org/'),('Futurepedia','https://www.futurepedia.io/'),
            ('G2','https://www.g2.com/'),('Hacker News','https://news.ycombinator.com/show'),('Indie Hackers','https://www.indiehackers.com/'),
            ('Launching Next','https://www.launchingnext.com/'),('MicroLaunch','https://microlaunch.net/'),('Product Hunt','https://www.producthunt.com/'),
            ('SaaS Worthy','https://www.saasworthy.com/'),('Startup Stash','https://startupstash.com/'),('Toolify','https://www.toolify.ai/'),
            ('Trustpilot','https://www.trustpilot.com/'),('Uneed','https://www.uneed.best/'),('OpenHunts','https://openhunts.com/'),
            ('Promote Project','https://www.promoteproject.com/'),('TrustMRR','https://trustmrr.com/startup/startup-directory'),('Peerlist','https://peerlist.io/'),
            ('Fazier','https://fazier.com/'),('LaunchIgniter','https://launchigniter.com/'),('AIxploria','https://www.aixploria.com/')
          ]
          out=[]; root=pathlib.Path('results/public-access-matrix'); root.mkdir(parents=True,exist_ok=True)
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36'
          markers=['access denied','forbidden','captcha','just a moment','checking your browser','blocked by','request blocked','security verification','verify you are human']
          for i,(name,url) in enumerate(urls,1):
              body=root/f'{i:02d}.html'; meta=root/f'{i:02d}.meta'
              cmd=['curl','-L','--compressed','--connect-timeout','8','--max-time','25','-A',ua,'-H','Accept-Language: en-US,en;q=0.9','-sS','-o',str(body),'-w','%{http_code}\t%{url_effective}\t%{size_download}\t%{time_total}',url]
              try:
                  p=subprocess.run(cmd,capture_output=True,text=True,timeout=35)
                  fields=(p.stdout or '').strip().split('\t')
                  code=int(fields[0]) if fields and fields[0].isdigit() else 0
                  final=fields[1] if len(fields)>1 else ''
                  size=int(float(fields[2])) if len(fields)>2 and fields[2] else 0
                  seconds=float(fields[3]) if len(fields)>3 and fields[3] else None
                  text=body.read_text(errors='ignore') if body.exists() else ''
                  low=text.lower()
                  marker=next((m for m in markers if m in low),None)
                  mt=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
                  title=html.unescape(re.sub(r'\s+',' ',mt.group(1)).strip())[:240] if mt else ''
                  transport_ok=200 <= code < 400
                  likely_blocked=(not transport_ok) or bool(marker)
                  rec={'name':name,'url':url,'status':code,'final_url':final,'bytes':size,'seconds':seconds,'title':title,'block_marker':marker,'transport_ok':transport_ok,'likely_blocked':likely_blocked,'curl_error':(p.stderr or '').strip()[:300]}
              except Exception as e:
                  rec={'name':name,'url':url,'status':0,'final_url':'','bytes':0,'seconds':None,'title':'','block_marker':None,'transport_ok':False,'likely_blocked':True,'curl_error':repr(e)}
              out.append(rec); print(json.dumps(rec,ensure_ascii=False),flush=True)
          summary={'total':len(out),'transport_ok':sum(x['transport_ok'] for x in out),'likely_blocked':sum(x['likely_blocked'] for x in out),'results':out}
          (root/'manifest.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/public-access-matrix
          git commit -m 'Store public access matrix [skip ci]' || true
          git push || true
