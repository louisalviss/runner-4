name: Cloak Latest Turnstile A/B

on:
  pull_request:
    branches: [main]
    paths:
      - 'jobs/cloak-latest-fingerprint/*.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET: 'https://nopecha.com/demo/turnstile'
      CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current browsers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'cloakbrowser==0.5.8'
          python -m playwright install-deps chromium
          python -m playwright install chromium
          if [ -n "${CLOAKBROWSER_LICENSE_KEY:-}" ]; then echo 'CLOAK_KEY_PRESENT=true'; else echo 'CLOAK_KEY_PRESENT=false'; fi
          python -m cloakbrowser install
          python -m cloakbrowser info || true

      - name: Run stock vs current Cloak
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ab.py <<'PY'
          import json, os, time
          from playwright.sync_api import sync_playwright
          from cloakbrowser import launch

          target = os.environ['TARGET']
          out = {'target': target, 'key_present': bool(os.environ.get('CLOAKBROWSER_LICENSE_KEY')), 'runs': []}

          def token_info(page):
              return page.evaluate('''() => {
                const els = [...document.querySelectorAll('input[name="cf-turnstile-response"], textarea[name="cf-turnstile-response"]')];
                const vals = els.map(e => e.value || '').filter(Boolean);
                return {count: els.length, tokenLengths: vals.map(v => v.length), tokenPresent: vals.some(v => v.length > 20)};
              }''')

          def run_one(name, browser):
              p = browser.new_page(viewport={'width':1365,'height':768})
              t0=time.time(); r=p.goto(target, wait_until='domcontentloaded', timeout=60000)
              samples=[]
              for i in range(10):
                  time.sleep(2)
                  try:
                      samples.append({'t':2*(i+1), **token_info(p), 'frames': [f.url for f in p.frames]})
                  except Exception as e:
                      samples.append({'t':2*(i+1), 'error':str(e)})
              body=p.locator('body').inner_text(timeout=15000)
              low=body.lower()
              ti=token_info(p)
              out['runs'].append({
                  'engine': name,
                  'status': r.status if r else None,
                  'final_url': p.url,
                  'title': p.title(),
                  'elapsed_s': round(time.time()-t0,3),
                  'body_excerpt': body[:3000],
                  'turnstile': ti,
                  'samples': samples,
                  'challenge_text': any(x in low for x in ['verify you are human','checking your browser','just a moment','failure','error']),
                  'fingerprint': p.evaluate('''() => ({webdriver:navigator.webdriver, ua:navigator.userAgent, platform:navigator.platform})''')
              })
              browser.close()

          with sync_playwright() as pw:
              run_one('stock_playwright', pw.chromium.launch(headless=False))

          run_one('cloak_151_latest', launch(headless=False, humanize=True))

          print('RESULT_JSON_START')
          print(json.dumps(out, ensure_ascii=False, indent=2))
          print('RESULT_JSON_END')
          PY
          xvfb-run -a python /tmp/ab.py
