name: Cloak Real Cloudflare Challenge A/B

on:
  pull_request:
    branches: [main]
    paths:
      - 'jobs/cloak-latest-fingerprint/*.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET: 'https://www.scrapingcourse.com/cloudflare-challenge'
      CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current browsers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'cloakbrowser==0.5.8'
          python -m playwright install-deps chromium
          python -m playwright install chromium
          if [ -n "${CLOAKBROWSER_LICENSE_KEY:-}" ]; then echo 'CLOAK_KEY_PRESENT=true'; else echo 'CLOAK_KEY_PRESENT=false'; fi
          python -m cloakbrowser install
          python -m cloakbrowser info || true

      - name: Run stock vs current Cloak
        shell: bash
        run: |
          set -uo pipefail
          cat > /tmp/ab.py <<'PY'
          import json, os, time, traceback
          from playwright.sync_api import sync_playwright
          from cloakbrowser import launch

          target = os.environ['TARGET']
          success_text = 'you bypassed the cloudflare challenge'

          def safe(call, default=None):
              try: return call()
              except Exception as e: return default if default is not None else f'ERROR:{type(e).__name__}:{e}'

          def snap(page, t):
              body = safe(lambda: page.locator('body').inner_text(timeout=3000), '')
              title = safe(lambda: page.title(), '')
              url = safe(lambda: page.url, '')
              cookie_names = safe(lambda: sorted({c.get('name','') for c in page.context.cookies()}), [])
              low=(body or '').lower(); combined=((title or '')+' '+(body or '')).lower()
              return {
                  't':t, 'title':title, 'url':url, 'body_excerpt':(body or '')[:1000],
                  'passed':success_text in low,
                  'challenge':any(x in combined for x in ['just a moment','verify you are human','checking if the site connection is secure','performing security verification']),
                  'cf_clearance':'cf_clearance' in (cookie_names if isinstance(cookie_names,list) else []),
                  'closed': safe(lambda: page.is_closed(), True),
              }

          def run_one(name, browser_factory):
              result={'engine':name,'samples':[]}
              browser=None; page=None; t0=time.time()
              try:
                  browser=browser_factory()
                  page=browser.new_page(viewport={'width':1365,'height':768})
                  try:
                      resp=page.goto(target, wait_until='domcontentloaded', timeout=60000)
                      result['initial_status']=resp.status if resp else None
                      result['nav_error']=None
                  except Exception as e:
                      result['initial_status']=None
                      result['nav_error']=f'{type(e).__name__}: {e}'
                  for t in [3,8,15,25,40]:
                      remaining=t-(time.time()-t0)
                      if remaining>0: time.sleep(remaining)
                      s=snap(page,t); result['samples'].append(s)
                      print('SAMPLE',name,json.dumps(s,ensure_ascii=False),flush=True)
                      if s.get('passed') or s.get('closed'):
                          break
                  result['final']=snap(page,round(time.time()-t0,1))
                  result['fingerprint']=safe(lambda: page.evaluate('''() => ({webdriver:navigator.webdriver, ua:navigator.userAgent, platform:navigator.platform, languages:navigator.languages, plugins:navigator.plugins.length, hardwareConcurrency:navigator.hardwareConcurrency, deviceMemory:navigator.deviceMemory||null})'''), {})
              except Exception as e:
                  result['fatal_error']=f'{type(e).__name__}: {e}'
                  result['traceback']=traceback.format_exc()[-3000:]
                  if page is not None:
                      result['final']=snap(page,round(time.time()-t0,1))
              finally:
                  result['elapsed_s']=round(time.time()-t0,3)
                  if browser is not None:
                      try: browser.close()
                      except Exception: pass
              print('ENGINE_RESULT',json.dumps(result,ensure_ascii=False),flush=True)
              return result

          runs=[]
          with sync_playwright() as pw:
              runs.append(run_one('stock_playwright', lambda: pw.chromium.launch(headless=False)))
          runs.append(run_one('cloak_151_latest', lambda: launch(headless=False, humanize=True)))
          out={'target':target,'key_present':bool(os.environ.get('CLOAKBROWSER_LICENSE_KEY')),'runs':runs}
          print('RESULT_JSON_START',flush=True)
          print(json.dumps(out,ensure_ascii=False,indent=2),flush=True)
          print('RESULT_JSON_END',flush=True)
          PY
          xvfb-run -a python /tmp/ab.py
