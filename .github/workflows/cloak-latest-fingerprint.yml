name: Cloak Real Cloudflare Challenge A/B

on:
  pull_request:
    branches: [main]
    paths:
      - 'jobs/cloak-latest-fingerprint/*.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET: 'https://www.scrapingcourse.com/cloudflare-challenge'
      CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current browsers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'cloakbrowser==0.5.8'
          python -m playwright install-deps chromium
          python -m playwright install chromium
          if [ -n "${CLOAKBROWSER_LICENSE_KEY:-}" ]; then echo 'CLOAK_KEY_PRESENT=true'; else echo 'CLOAK_KEY_PRESENT=false'; fi
          python -m cloakbrowser install
          python -m cloakbrowser info || true

      - name: Run stock vs current Cloak
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ab.py <<'PY'
          import json, os, time
          from playwright.sync_api import sync_playwright
          from cloakbrowser import launch

          target = os.environ['TARGET']
          success_text = 'you bypassed the cloudflare challenge'
          out = {'target': target, 'key_present': bool(os.environ.get('CLOAKBROWSER_LICENSE_KEY')), 'runs': []}

          def snap(page, t):
              try:
                  body = page.locator('body').inner_text(timeout=5000)
              except Exception as e:
                  body = f'BODY_ERROR: {e}'
              low = body.lower()
              names = sorted({c.get('name','') for c in page.context.cookies()})
              return {
                  't': t,
                  'title': page.title(),
                  'url': page.url,
                  'body_excerpt': body[:700],
                  'passed': success_text in low,
                  'challenge': any(x in (page.title()+' '+body).lower() for x in ['just a moment','verify you are human','checking if the site connection is secure','performing security verification']),
                  'cf_clearance': 'cf_clearance' in names,
              }

          def run_one(name, browser):
              p = browser.new_page(viewport={'width':1365,'height':768})
              t0=time.time()
              try:
                  r=p.goto(target, wait_until='domcontentloaded', timeout=60000)
              except Exception as e:
                  r=None
                  nav_error=str(e)
              else:
                  nav_error=None
              samples=[]
              for t in [3, 8, 15, 25, 40]:
                  remaining=t-(time.time()-t0)
                  if remaining>0: time.sleep(remaining)
                  samples.append(snap(p,t))
                  if samples[-1]['passed']:
                      break
              final=snap(p, round(time.time()-t0,1))
              out['runs'].append({
                  'engine':name,
                  'initial_status':r.status if r else None,
                  'nav_error':nav_error,
                  'elapsed_s':round(time.time()-t0,3),
                  'final':final,
                  'samples':samples,
                  'fingerprint':p.evaluate('''() => ({webdriver:navigator.webdriver, ua:navigator.userAgent, platform:navigator.platform, languages:navigator.languages, plugins:navigator.plugins.length, hardwareConcurrency:navigator.hardwareConcurrency, deviceMemory:navigator.deviceMemory||null})''')
              })
              browser.close()

          with sync_playwright() as pw:
              run_one('stock_playwright', pw.chromium.launch(headless=False))
          run_one('cloak_151_latest', launch(headless=False, humanize=True))

          print('RESULT_JSON_START')
          print(json.dumps(out, ensure_ascii=False, indent=2))
          print('RESULT_JSON_END')
          PY
          xvfb-run -a python /tmp/ab.py
