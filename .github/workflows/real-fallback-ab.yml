name: Real Fallback A/B

on:
  push:
    branches: [main]
    paths:
      - 'jobs/real-fallback-ab/*.json'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOAKBROWSER_VERSION: '146.0.7680.177.5'
      TARGET: 'https://demo.fingerprint.com/web-scraping'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache CloakBrowser binary
        uses: actions/cache@v4
        with:
          path: ~/.cloakbrowser
          key: cloakbrowser-linux-146.0.7680.177.5

      - name: Install browsers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'cloakbrowser==0.5.3'
          python -m playwright install-deps chromium
          python -m playwright install chromium
          CLOAKBROWSER_VERSION="$CLOAKBROWSER_VERSION" python -m cloakbrowser install

      - name: Run stock vs Cloak
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ab.py <<'PY'
          import json, os, re, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from cloakbrowser import launch

          TARGET = os.environ['TARGET']
          OUT = Path('results/real-fallback-ab')
          OUT.mkdir(parents=True, exist_ok=True)

          def summarize(name, page, response, elapsed):
              try:
                  body = page.locator('body').inner_text(timeout=10000)
              except Exception as e:
                  body = f'BODY_ERROR: {e}'
              low = body.lower()
              return {
                  'engine': name,
                  'target': TARGET,
                  'status': response.status if response else None,
                  'final_url': page.url,
                  'title': page.title(),
                  'elapsed_s': round(elapsed, 3),
                  'body_len': len(body),
                  'body_excerpt': body[:12000],
                  'signals': {
                      'contains_access_denied': 'access denied' in low,
                      'contains_blocked': 'blocked' in low,
                      'contains_bot': bool(re.search(r'\\bbot\\b', low)),
                      'contains_automation': 'automation' in low,
                      'contains_scraping': 'scrap' in low,
                  },
                  'fingerprint': page.evaluate('''() => ({
                      webdriver: navigator.webdriver,
                      ua: navigator.userAgent,
                      platform: navigator.platform,
                      languages: navigator.languages,
                      plugins: navigator.plugins.length,
                      hardwareConcurrency: navigator.hardwareConcurrency,
                      deviceMemory: navigator.deviceMemory || null
                  })''')
              }

          results = {'generated_at': time.time(), 'target': TARGET, 'runs': []}

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=False)
              page = browser.new_page(viewport={'width': 1365, 'height': 768})
              t0 = time.time()
              resp = page.goto(TARGET, wait_until='domcontentloaded', timeout=60000)
              time.sleep(8)
              results['runs'].append(summarize('stock_playwright', page, resp, time.time()-t0))
              page.screenshot(path=str(OUT/'stock.png'), full_page=True)
              browser.close()

          browser = launch(headless=False, humanize=True)
          page = browser.new_page()
          t0 = time.time()
          resp = page.goto(TARGET, wait_until='domcontentloaded', timeout=60000)
          time.sleep(8)
          results['runs'].append(summarize('cloakbrowser_v146', page, resp, time.time()-t0))
          page.screenshot(path=str(OUT/'cloak.png'), full_page=True)
          browser.close()

          (OUT/'latest.json').write_text(json.dumps(results, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(results, indent=2, ensure_ascii=False))
          PY
          xvfb-run -a python /tmp/ab.py

      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/real-fallback-ab/
          git diff --cached --quiet && exit 0
          git commit -m 'Store real fallback A/B result [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-fallback-ab-${{ github.run_id }}
          path: results/real-fallback-ab/
          retention-days: 3
