name: Telegram Username HTTP Crawl

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-username-http-crawl.yml"
      - "telegram-crawl-trigger.txt"

permissions:
  contents: write

concurrency:
  group: telegram-username-http-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: python -m pip install requests beautifulsoup4
      - name: Crawl public endpoints
        shell: bash
        run: |
          mkdir -p crawl-results
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          COL='EQCA14o1-VWhS2efqoh_9M1b_A9DtKTuoqfmkn83AbJzwnPi'
          urls=[
            'https://fragment.com/',
            'https://fragment.com/?query=ai',
            f'https://getgems.io/collection/{COL}',
            'https://fragstat.org/',
            'https://fragstat.org/marketplace',
            f'https://api.getgems.io/public-api/v1/collection/{COL}',
            f'https://api.getgems.io/public-api/v1/nfts/on-sale/{COL}',
            f'https://tonapi.io/v2/nfts/collections/{COL}/items?limit=1000&offset=0',
          ]
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
            'Accept-Language':'en-US,en;q=0.9',
          }
          out=[]
          for u in urls:
            row={'url':u}
            try:
              r=requests.get(u,headers=headers,timeout=30,allow_redirects=True)
              row.update(status=r.status_code, final_url=r.url, content_type=r.headers.get('content-type'), length=len(r.content))
              text=r.text
              row['text_head']=text[:12000]
              if 'html' in (r.headers.get('content-type') or ''):
                soup=BeautifulSoup(text,'html.parser')
                row['title']=soup.title.get_text(' ',strip=True) if soup.title else None
                row['links']=[{'text':a.get_text(' ',strip=True)[:120], 'href':a.get('href')} for a in soup.find_all('a',href=True)[:500]]
                row['usernames']=sorted(set(re.findall(r'@([A-Za-z0-9_]{4,32})', soup.get_text('\n'))))[:1000]
              elif 'json' in (r.headers.get('content-type') or ''):
                try: row['json']=r.json()
                except Exception: pass
            except Exception as e:
              row['error']=repr(e)
            out.append(row)
            time.sleep(1)
          Path('crawl-results/http.json').write_text(json.dumps({'captured_at':time.time(),'results':out},ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name "runner-4-bot"
          git config user.email "runner-4-bot@users.noreply.github.com"
          git add crawl-results/http.json
          git commit -m "Update Telegram username HTTP crawl" || exit 0
          git push
