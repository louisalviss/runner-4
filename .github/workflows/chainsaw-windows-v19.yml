name: Chainsaw Windows V19

on:
  pull_request:
    paths:
      - trigger/chainsaw-windows-v19.txt

permissions:
  contents: read

jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install portable ffmpeg
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -q imageio-ffmpeg

      - name: Download official promo clips and render
        shell: pwsh
        run: |
          @'
          import json, math, os, pathlib, subprocess, urllib.parse, urllib.request
          import imageio_ffmpeg

          ROOT = pathlib.Path.cwd()
          WORK = ROOT / 'work'
          WORK.mkdir(exist_ok=True)
          CLIPS = WORK / 'clips'
          CLIPS.mkdir(exist_ok=True)
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          ua = {'User-Agent': 'Mozilla/5.0'}

          sources = {
              'fight': 'https://media1.tenor.com/m/lrPq8cKmfIUAAAAd/explosive-attack-bomb-girl.gif',
              'incoming': 'https://media1.tenor.com/m/V8W5uC8kGB0AAAAd/incoming-attack-chainsaw-man---the-movie-reze-arc.gif',
              'bomb': 'https://media1.tenor.com/m/p_rlJAIhcjIAAAAd/explosive-attack-bomb-girl.gif',
              'massive': 'https://media1.tenor.com/m/eZNU7uVMe9QAAAAd/massive-explosion-chainsaw-man---the-movie-reze-arc.gif',
          }

          def run(cmd):
              print('+', ' '.join(map(str, cmd)), flush=True)
              subprocess.run([str(x) for x in cmd], check=True)

          def download(url, path):
              req = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(req, timeout=60) as r, open(path, 'wb') as f:
                  while True:
                      b = r.read(1024 * 1024)
                      if not b:
                          break
                      f.write(b)
              if path.stat().st_size < 2048:
                  raise RuntimeError(f'source too small: {path}')

          norm = {}
          for sid, url in sources.items():
              raw = WORK / f'{sid}.gif'
              out = WORK / f'{sid}.mp4'
              download(url, raw)
              run([
                  ffmpeg, '-hide_banner', '-loglevel', 'error', '-y',
                  '-stream_loop', '2', '-i', raw, '-t', '5.2',
                  '-vf', 'fps=30,scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,setsar=1,format=yuv420p',
                  '-an', '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '18', out
              ])
              norm[sid] = out

          # Official 30s iTunes/Apple preview of MONTAGEM XONADA.
          params = urllib.parse.urlencode({
              'term': 'MONTAGEM XONADA MXZI Dj Samir DJ Javi26',
              'entity': 'song', 'limit': 50, 'country': 'US'
          })
          req = urllib.request.Request('https://itunes.apple.com/search?' + params, headers=ua)
          with urllib.request.urlopen(req, timeout=45) as r:
              data = json.load(r)
          match = None
          for item in data.get('results', []):
              if (item.get('trackName') or '').strip().lower() == 'montagem xonada' and 'mxzi' in (item.get('artistName') or '').lower() and item.get('previewUrl'):
                  match = item
                  break
          if not match:
              raise RuntimeError('XONADA preview not found')
          music = WORK / 'xonada.m4a'
          download(match['previewUrl'], music)

          bpm = 172.0
          beat = 60.0 / bpm
          seq = [
              ('incoming',0.00,0.25,0.5,'hit'),
              ('bomb',0.00,0.25,0.5,'hit'),
              ('fight',0.00,0.25,0.5,'hit'),
              ('massive',0.00,0.25,0.5,'hit'),
              ('fight',0.10,1.20,2,'fight'),
              ('bomb',0.15,1.25,2,'bomb'),
              ('incoming',0.20,1.55,2,'incoming'),
              ('massive',0.10,1.55,2,'massive'),
              ('fight',0.80,2.20,2,'fight'),
              ('bomb',0.70,2.10,2,'bomb'),
              ('incoming',1.50,3.20,4,'incoming'),
              ('fight',1.40,2.75,4,'fight'),
              ('bomb',1.20,2.70,4,'bomb'),
              ('massive',0.60,2.60,4,'massive'),
              ('fight',0.20,2.60,4,'fight'),
              ('bomb',0.30,2.70,4,'bomb'),
          ]
          total_beats = sum(x[3] for x in seq)
          assert abs(total_beats - 38) < 1e-9
          total = total_beats * beat

          concat_lines = []
          timeline = []
          out_t = 0.0
          for i, (sid, st, en, beats, style) in enumerate(seq):
              sd = en - st
              od = beats * beat
              factor = od / sd
              clip = CLIPS / f'c{i:02d}.mp4'
              # Main action uses a 520x720 central crop -> 1080x1496.
              # This is much less destructive than a full 9:16 landscape crop,
              # while still filling most of a vertical screen.
              fx = (
                  f'[0:v]split=2[b][f];'
                  f'[b]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,'
                  f'gblur=sigma=34,eq=brightness=-0.22:saturation=1.05[b2];'
                  f'[f]crop=520:720:(iw-520)/2:0,scale=1080:1496,'
                  f'eq=contrast=1.20:saturation=1.28:gamma=0.95'
              )
              if style in {'bomb','massive'}:
                  fx += ',colorbalance=rs=.10:bs=-.035'
              else:
                  fx += ',colorbalance=bs=.08:rs=-.02'
              if style == 'hit':
                  fx += ",rgbashift=rh=6:bh=-6,drawbox=x=0:y=0:w=iw:h=ih:color=white@.30:t=fill:enable='lt(t,.045)'"
              fx += (
                  f'[f2];[b2][f2]overlay=(W-w)/2:(H-h)/2,'
                  f'setpts=(PTS-STARTPTS)*{factor:.8f},setsar=1,fps=30,format=yuv420p[v]'
              )
              run([
                  ffmpeg, '-hide_banner', '-loglevel', 'error', '-y',
                  '-ss', f'{st:.3f}', '-i', norm[sid], '-t', f'{sd:.3f}',
                  '-filter_complex', fx, '-map', '[v]', '-an', '-t', f'{od:.6f}',
                  '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '17',
                  '-profile:v', 'high', '-pix_fmt', 'yuv420p', clip
              ])
              concat_lines.append(f"file '{clip.as_posix()}'")
              timeline.append({'i': i+1, 'source': sid, 'src': [st,en], 'beats': beats, 'style': style, 'out': [out_t, out_t+od]})
              out_t += od

          concat = WORK / 'concat.txt'
          concat.write_text('\n'.join(concat_lines) + '\n', encoding='utf-8')
          visual = WORK / 'visual.mp4'
          run([ffmpeg, '-hide_banner', '-loglevel', 'error', '-y', '-f', 'concat', '-safe', '0', '-i', concat, '-c', 'copy', visual])

          final = ROOT / 'chainsaw_reze_tiktok_v19.mp4'
          run([
              ffmpeg, '-hide_banner', '-loglevel', 'error', '-y',
              '-i', visual, '-ss', '11.065', '-i', music, '-t', f'{total:.6f}',
              '-map', '0:v:0', '-map', '1:a:0', '-c:v', 'copy',
              '-af', 'volume=1.04,bass=g=3:f=90,alimiter=limit=.94',
              '-c:a', 'aac', '-b:a', '192k', '-ar', '48000', '-ac', '2',
              '-movflags', '+faststart', final
          ])

          qa = ROOT / 'qa'
          qa.mkdir(exist_ok=True)
          interval = total / 14.0
          run([ffmpeg,'-hide_banner','-loglevel','error','-y','-i',final,'-vf',f'fps=1/{interval:.6f},scale=180:-2,tile=7x2:padding=3:margin=3','-frames:v','1',qa/'master_contact.jpg'])
          run([ffmpeg,'-hide_banner','-loglevel','error','-y','-i',final,'-vf',f'crop=886:1920:97:0,fps=1/{interval:.6f},scale=180:-2,tile=7x2:padding=3:margin=3','-frames:v','1',qa/'iphone_19_5_contact.jpg'])

          manifest = {
              'anime': 'Chainsaw Man - The Movie: Reze Arc',
              'source_pool': 'SonyPictures official promotional Tenor clips',
              'music': {'track': match.get('trackName'), 'artist': match.get('artistName')},
              'bpm': bpm,
              'beats': total_beats,
              'duration_target': total,
              'shots': len(seq),
              'iphone_safe_width': 886,
              'foreground_crop': '520x720 -> 1080x1496 over blurred 1080x1920',
              'timeline': timeline,
          }
          (ROOT/'v19_manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(json.dumps({k: manifest[k] for k in ('beats','duration_target','shots')}, indent=2))
          '@ | Set-Content -Encoding UTF8 render_v19.py
          python render_v19.py

      - name: Upload V19
        uses: actions/upload-artifact@v4
        with:
          name: chainsaw-reze-v19
          path: |
            chainsaw_reze_tiktok_v19.mp4
            v19_manifest.json
            qa/master_contact.jpg
            qa/iphone_19_5_contact.jpg
          retention-days: 3
          if-no-files-found: error
