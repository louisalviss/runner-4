name: Cutover Smoke

on:
  push:
    paths:
      - .github/workflows/cutover-smoke.yml
  pull_request:
    paths:
      - smoke-trigger.txt

permissions:
  contents: read
  actions: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/ingest.py configs/chainsaw-reze-v18d.json work/source
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-source
          path: work/source
          retention-days: 1
          if-no-files-found: error

  render:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-source
          path: work/source
      - run: python scripts/render.py configs/chainsaw-reze-v18d.json work/source out/final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-render
          path: |
            out/final.mp4
            out/render_manifest.json
            out/edit_plan.txt
          retention-days: 1
          if-no-files-found: error

  qa:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-render
          path: out
      - run: python scripts/qa.py configs/chainsaw-reze-v18d.json out/final.mp4 qa
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-qa
          path: qa
          retention-days: 1
          if-no-files-found: error
