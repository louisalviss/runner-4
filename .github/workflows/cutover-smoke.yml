name: Cutover Smoke

on:
  push:
    paths:
      - .github/workflows/cutover-smoke.yml

permissions:
  contents: write
  actions: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/ingest.py configs/chainsaw-reze-v18d.json work/source
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-source
          path: work/source
          retention-days: 1
          if-no-files-found: error

  render:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-source
          path: work/source
      - run: python scripts/render.py configs/chainsaw-reze-v18d.json work/source out/final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-render
          path: |
            out/final.mp4
            out/render_manifest.json
            out/edit_plan.txt
          retention-days: 1
          if-no-files-found: error

  qa:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-render
          path: out
      - run: python scripts/qa.py configs/chainsaw-reze-v18d.json out/final.mp4 qa
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-qa
          path: qa
          retention-days: 1
          if-no-files-found: error

  report:
    if: always()
    needs: [ingest, render, qa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write one-time smoke marker
        env:
          INGEST_RESULT: ${{ needs.ingest.result }}
          RENDER_RESULT: ${{ needs.render.result }}
          QA_RESULT: ${{ needs.qa.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          d = {
            "run_id": os.environ["RUN_ID"],
            "ingest": os.environ["INGEST_RESULT"],
            "render": os.environ["RENDER_RESULT"],
            "qa": os.environ["QA_RESULT"],
          }
          d["pass"] = all(d[x] == "success" for x in ("ingest", "render", "qa"))
          open("cutover-smoke-status.json", "w").write(json.dumps(d, indent=2) + "\n")
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add cutover-smoke-status.json
          git commit -m "Record runner-4 cutover smoke result" || true
          git push
