name: ARM Scheduler Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'jobs/arm-scheduler-probe/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - run: |
          uname -a
          date -u
          echo arm-scheduler-ok
